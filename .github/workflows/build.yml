# Builds the miner image on GitHub's servers and pushes it to GHCR, so you
# don't need Docker installed locally.
#
# After the first successful run, make the package PUBLIC so SaladCloud can
# pull it:  github.com/<you>?tab=packages -> pearl-salad-nvidia -> Package settings
#           -> Change visibility -> Public
#
# Image name: ghcr.io/<you>/pearl-salad-nvidia
name: build-and-push

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: repo
        run: echo "name=ghcr.io/$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')/pearl-salad-nvidia" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.repo.outputs.name }}:latest
            ${{ steps.repo.outputs.name }}:v${{ github.run_number }}
            ${{ steps.repo.outputs.name }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
