# Builds the miner images on GitHub's servers and pushes them to GHCR, so you
# don't need Docker installed locally.
#
# After the first successful run, make each package PUBLIC so SaladCloud can
# pull it:  github.com/<you>?tab=packages -> <package> -> Package settings
#           -> Change visibility -> Public
#
# Two images from one Dockerfile (multi-stage):
#   ghcr.io/<you>/pearl-salad-nvidia        target "miner"  - production entrypoint
#   ghcr.io/<you>/pearl-salad-nvidia-bench  target "bench"  - runs every miner for
#                                           a window and prints a hashrate table
#
# Tags produced (for both):
#   push to main        -> :latest, :sha-<short sha>
#   git tag vX.Y.Z      -> :vX.Y.Z, :vX.Y, :sha-<short sha>   (latest untouched)
# Deploy Salad groups on a :vX.Y.Z tag so a reallocation can't silently pick
# up a newer build. Cut a release with:
#   git tag -a v1.2.3 -m "what changed" && git push origin v1.2.3
name: build-and-push

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: miner
            image: pearl-salad-nvidia
          - target: bench
            image: pearl-salad-nvidia-bench
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          tags: |
            type=semver,pattern=v{{version}}
            type=semver,pattern=v{{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-

      - uses: docker/build-push-action@v6
        with:
          context: .
          target: ${{ matrix.target }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            IMAGE_VERSION=${{ steps.meta.outputs.version }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
